<!doctype html>
<html lang="pt-BR">
<head>
<title>Treino Sob Medida</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#110D0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: app de uma coluna, cabeçalho com seletor de pessoa, abas fixas; cartões só para treinos e métricas */
:root{
  /* Tema escuro único, vermelho como cor de destaque */
  --bg:#110D0E; --surface:#1B1517; --ink:#F4EDEE; --muted:#B4A7A9; --line:#3A2C30;
  --accent:#FF5A5F; --accent-ink:#1A0809; --accent-soft:#3B171A;
  --warn:#F6B84E; --warn-bg:#2B2210; --ok:#5ED493; --sport:#C9A2F5; --sport-soft:#2A2040;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html{height:100%}body{margin:0;min-height:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:860px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 12px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:2rem;line-height:1}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:.85rem;color:var(--muted);letter-spacing:0;margin-top:4px}
h2{font-size:1.5rem;margin-bottom:12px}
h3{font-size:1.2rem}
.who{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.pp{display:grid;justify-items:center;gap:4px;background:none;border:0;padding:4px;border-radius:12px;color:var(--muted);font-size:.75rem;font-weight:600;width:64px}
.pp[aria-pressed="true"]{color:var(--ink)}
.pp[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.pp span{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp.add .av{background:none;border:2px dashed var(--line);color:var(--muted)}
.av{display:grid;place-items:center;border-radius:50%;overflow:hidden;flex:none;font-family:var(--f-display);font-weight:700;color:#fff}
.av img{width:100%;height:100%;object-fit:cover}
.av svg{width:58%;height:58%}
.avbig{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.avgrid{display:flex;flex-wrap:wrap;gap:8px}
.avgrid button{padding:0;border:0;background:none;border-radius:50%}
.avgrid button[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.colors{display:flex;flex-wrap:wrap;gap:8px}
.colors button{width:28px;height:28px;border-radius:50%;padding:0;border:2px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}
label{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--warn);border-color:var(--warn)}
nav{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--muted);padding:10px 14px;font-family:var(--f-display);font-size:1.1rem;letter-spacing:.03em;text-transform:uppercase}
@media (max-width:520px){nav{gap:0}nav button{padding:10px 7px;font-size:.95rem;letter-spacing:.01em}}
nav button{white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
section{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
section>*{min-width:0}
select{max-width:100%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stat .v{font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v span{font-size:1rem;color:var(--muted);font-weight:600}
.stat .l{font-size:.85rem;color:var(--muted)}
.alert{background:var(--warn-bg);color:var(--ink);border-left:4px solid var(--warn);border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.alert b{color:var(--warn)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 6px;text-align:center;min-height:86px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.day .d{font-family:var(--f-display);font-weight:700;text-transform:uppercase;font-size:1rem}
.day .t{font-size:.78rem;line-height:1.25;color:var(--muted)}
.day.lift{background:var(--accent-soft);border-color:var(--accent)}
.day.lift .t{color:var(--ink)}
.day.sport{background:var(--sport-soft);border-color:var(--sport)}
.day.sport .t{color:var(--ink)}
.day.today{box-shadow:0 0 0 2px var(--ink)}
@media (max-width:560px){.week{grid-template-columns:1fr}.day{flex-direction:row;min-height:0;text-align:left;align-items:center;gap:12px;padding:8px 12px}.day .d{width:44px}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
.tag{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--warn)}
.muted{color:var(--muted);font-size:.9rem}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.field{display:grid;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-size:.9rem;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;cursor:pointer}
.chip input{margin:0;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:0}
.ex-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ex-head b{font-size:1.02rem}
.sets{display:flex;flex-wrap:wrap;gap:6px}
.sets input{width:76px;font-family:var(--f-mono);font-size:.9rem}
.chart{width:100%;height:auto;display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--warn-bg);padding:10px;border-radius:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;align-content:start}
.ph img,.ph .noimg{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--accent-soft)}
.ph .noimg{display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.ph .meta{padding:10px;display:grid;gap:4px;font-size:.85rem}
.ph .meta b{font-family:var(--f-display);font-size:1.05rem}
.ph .meta .del{justify-self:start;padding:4px 10px;font-size:.8rem}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp figure{margin:0;display:grid;gap:6px}
.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--accent-soft)}
.cmp figcaption{font-size:.85rem;color:var(--muted)}
.cmp figcaption b{color:var(--ink);font-family:var(--f-display);font-size:1.05rem}
#r-prev img{max-width:140px;border-radius:8px;display:block}
.checkin{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;border-color:var(--accent)}
.checkin .done{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.day .ck{font-size:.75rem;font-weight:600;color:var(--ok)}
.day.done{outline:2px solid var(--ok);outline-offset:-2px}
.ai textarea{width:100%;font-size:.9rem}
.ai textarea[readonly]{color:var(--muted);font-family:var(--f-mono);font-size:.78rem}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);padding:10px 12px;border-radius:8px}
.chat{display:grid;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.bot{justify-self:start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.bot .plan{white-space:normal;margin-top:10px;display:grid;gap:8px}
.msg.err{border-color:var(--warn);color:var(--warn)}
.composer{display:grid;gap:8px;position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding-block:8px}
.composer textarea{width:100%;resize:vertical}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{font-weight:500;font-size:.85rem;border-radius:999px;padding:6px 12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details.card summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
footer{margin-top:32px;font-size:.82rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){nav button{transition:color .15s,border-color .15s}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1>Treino Sob Medida<small>Musculação, esporte e alimentação ajustados a cada pessoa</small></h1>
    <div class="who" id="who" role="group" aria-label="Pessoa">
    </div>
  </header>
  <nav role="tablist">
    <button role="tab" data-tab="plano">Plano</button>
    <button role="tab" data-tab="treino">Treino</button>
    <button role="tab" data-tab="progresso">Progresso</button>
    <button role="tab" data-tab="ia">IA</button>
    <button role="tab" data-tab="fotos">Fotos</button>
    <button role="tab" data-tab="perfil">Perfil</button>
  </nav>
  <main id="view"></main>
  <footer>Estimativas gerais a partir de fórmulas padrão (IMC, Mifflin-St Jeor). Não substituem médico, nutricionista ou professor de educação física. Os dados e as fotos ficam salvos só neste aparelho.</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DAYS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DAYS_FULL=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const SPORTS={boxe:'Boxe',muaythai:'Muay thai',jiujitsu:'Jiu-jitsu',corrida:'Corrida',natacao:'Natação',futebol:'Futebol',nenhum:'Nenhum'};
const CONTACT=['boxe','muaythai','jiujitsu'];
const FLAGS={circ:'Problema circulatório ou trombose (ex.: tromboflebite)',knee:'Dor ou lesão no joelho',shoulder:'Dor ou lesão no ombro',back:'Dor lombar'};

const LIB={
  legpress:{g:'Leg press',h:'Agachamento livre',leg:1},
  squat:{g:'Agachamento livre',h:'Agachamento livre',leg:1,heavy:1},
  goblet:{g:'Agachamento com halter (goblet)',h:'Agachamento com mochila',leg:1},
  ext:{g:'Cadeira extensora',h:'Afundo estático',leg:1},
  flex:{g:'Mesa flexora',h:'Ponte de glúteo unilateral',leg:1},
  hip:{g:'Elevação pélvica',h:'Elevação pélvica no chão',leg:1},
  rdl:{g:'Stiff com halteres',h:'Stiff com mochila',leg:1,heavy:1},
  calf:{g:'Panturrilha sentado',h:'Panturrilha no degrau',leg:1},
  bench:{g:'Supino na máquina',h:'Flexão de braço',push:1},
  pushup:{g:'Flexão de braço',h:'Flexão de braço',push:1,bw:1},
  incl:{g:'Supino inclinado com halteres',h:'Flexão com pés elevados',push:1},
  pulldown:{g:'Puxada frontal',h:'Remada invertida na mesa'},
  row:{g:'Remada sentada',h:'Remada curvada com mochila'},
  row1:{g:'Remada unilateral com halter',h:'Remada unilateral com galão'},
  ohp:{g:'Desenvolvimento com halteres',h:'Flexão pike',push:1},
  lat:{g:'Elevação lateral',h:'Elevação lateral com garrafas'},
  curl:{g:'Rosca direta',h:'Rosca com mochila'},
  tri:{g:'Tríceps na polia',h:'Tríceps no banco',push:1},
  farmer:{g:'Caminhada com halteres (farmer walk)',h:'Caminhada com sacolas pesadas',dist:1},
  plank:{g:'Prancha',h:'Prancha',time:1},
  crunch:{g:'Abdominal remador',h:'Abdominal remador',bw:1},
  bike:{g:'Bicicleta em ritmo moderado',h:'Polichinelo e corrida parada',cardio:1}
};
const TPL={
  lower:{t:'Pernas e abdômen',x:['legpress','ext','flex','hip','calf','plank']},
  upper:{t:'Parte de cima do corpo',x:['bench','pulldown','row','ohp','curl','tri']},
  full:{t:'Corpo inteiro e condicionamento',x:['goblet','pushup','row1','farmer','crunch','bike']},
  fullA:{t:'Corpo inteiro A',x:['squat','bench','row','hip','plank']},
  fullB:{t:'Corpo inteiro B',x:['legpress','ohp','pulldown','rdl','crunch']},
  upper2:{t:'Parte de cima 2',x:['incl','row1','lat','pulldown','curl','tri']},
  lower2:{t:'Pernas 2',x:['squat','rdl','hip','calf','crunch']},
  push:{t:'Peito, ombro e tríceps',x:['bench','incl','ohp','lat','tri']},
  pull:{t:'Costas e bíceps',x:['pulldown','row','row1','curl','crunch']},
  legs:{t:'Pernas',x:['squat','legpress','rdl','calf','plank']}
};
const SWAP={
  circ:{squat:'legpress',rdl:'flex'},
  knee:{squat:'hip',goblet:'legpress',ext:'flex'},
  shoulder:{ohp:'lat',incl:'bench'},
  back:{squat:'legpress',rdl:'hip',goblet:'legpress'}
};

/* ---------- armazenamento ---------- */
const KEY='treino-sob-medida.v1';
function seed(){
  const id='andre';
  return {active:id,profiles:[{id,name:'André',sex:'m',age:27,weight:83,height:173,level:'iniciante',goal:'emagrecer',place:'academia',
    liftDays:[4,5,6],sport:'boxe',sportDays:[1,3],flags:['circ'],avIcon:'luva',avColor:'#E5484D',notes:'Tromboflebite na coxa esquerda'}],
    logs:{[id]:{weights:[{date:'2026-10-08',kg:83}],workouts:[]}}};
}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.profiles||!S.profiles.length)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const P=()=>S.profiles.find(p=>p.id===S.active)||S.profiles[0];
const L=()=>{const l=(S.logs[P().id]=S.logs[P().id]||{weights:[],workouts:[]});l.checkins=l.checkins||{};return l};

/* ---------- utilidades ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const fmt=n=>r1(n).toLocaleString('pt-BR');
const todayIdx=()=>(new Date().getDay()+6)%7;
const isoToday=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const brDate=s=>s.split('-').reverse().join('/');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* ---------- motor do plano ---------- */
function runOrder(days){
  const d=[...days].sort((a,b)=>a-b);
  if(d.length<2||d.length===7)return d;
  const start=d.find(x=>!d.includes((x+6)%7));
  const i=d.indexOf(start);return d.slice(i).concat(d.slice(0,i));
}
function buildPlan(p){
  const h=p.height/100, bmi=p.weight/(h*h);
  const healthy=[r1(18.5*h*h),r1(24.9*h*h)];
  let target=p.weight;
  if(p.goal==='emagrecer')target=bmi>=25?Math.round(24.5*h*h):Math.max(Math.round(healthy[0]+1),p.weight-3);
  if(p.goal==='ganhar')target=Math.round(p.weight+(bmi<22?5:3));
  const diff=Math.abs(p.weight-target);
  const weeks=p.goal==='manter'?0:Math.ceil(diff/(p.goal==='ganhar'?0.25:0.6));
  const sportDays=p.sport==='nenhum'?[]:p.sportDays;
  const sessions=p.liftDays.length+sportDays.length;
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const tdee=bmr*(1.2+0.07*Math.min(sessions,7));
  let kcal=tdee+(p.goal==='emagrecer'?-500:p.goal==='ganhar'?300:0);
  kcal=Math.max(kcal,bmr*1.05);kcal=Math.round(kcal/50)*50;
  const protW=bmi>=30?target:p.weight;
  const prot=Math.round(protW*(p.goal==='manter'?1.6:1.8));
  const fat=Math.round(p.weight*0.8);
  const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  const water=r1(p.weight*0.035+(sessions>=4?0.5:0));

  const order=runOrder(p.liftDays), n=order.length;
  const adj=order.filter(x=>order.includes((x+1)%7)).length;
  let split=[];
  if(n===1)split=['full'];
  else if(n===2)split=['fullA','fullB'];
  else if(n===3)split=adj>=2?['lower','upper','full']:['fullA','fullB','full'];
  else if(n===4)split=['upper','lower','upper2','lower2'];
  else split=['push','pull','legs','upper','lower','full','fullA'].slice(0,n);

  const flags=p.flags||[];
  const beginner=p.level==='iniciante';
  const workouts=order.map((day,i)=>{
    const tpl=TPL[split[i]];
    const exercises=tpl.x.map(k=>{
      let key=k;flags.forEach(f=>{if(SWAP[f]&&SWAP[f][key])key=SWAP[f][key]});
      const e=LIB[key];const notes=[];
      if(e.leg&&flags.includes('circ'))notes.push('Carga moderada até liberação do angiologista');
      if(e.leg&&flags.includes('knee'))notes.push('Só na amplitude sem dor');
      if(e.push&&flags.includes('shoulder'))notes.push('Movimento controlado, sem dor no ombro');
      let sets=beginner?3:4, reps=beginner?'10–12':'8–10';
      if(e.time){reps=beginner?'30 s':'45 s'}
      if(e.dist){reps='30 m'}
      if(e.bw&&!e.time){reps=key==='pushup'?'máximo':'15'}
      if(e.cardio){sets=1;reps=beginner?'15 min':'20 min'}
      return {key,name:p.place==='casa'?e.h:e.g,sets,reps,load:!(e.time||e.cardio||e.bw),notes};
    });
    return {id:split[i]+'-'+day,day,title:tpl.t,letter:String.fromCharCode(65+i),exercises};
  });

  let custom=null;
  if(p.custom&&p.custom.active){
    custom=p.custom;workouts.length=0;let li=0;
    Object.keys(custom.days).map(Number).sort((a,b)=>a-b).forEach(day=>{
      const d=custom.days[day];if(!d.exercises.length)return;
      workouts.push({id:'c-'+day,day,title:d.title,letter:String.fromCharCode(65+li++),exercises:d.exercises.map(e=>({key:'c:'+e.name.toLowerCase(),name:e.name,sets:e.sets||1,reps:e.reps||'',load:!/\b(s|seg|min|minutos|segundos|m|km)\b|máx|falha/i.test(e.reps||'')&&!!e.sets,notes:e.note?[e.note]:[],free:!e.sets}))});
    });
  }
  const week=DAYS.map((d,i)=>{
    const w=workouts.find(x=>x.day===i);
    if(custom&&!w&&custom.days[i])return {cls:/descanso|folga|off/i.test(custom.days[i].title)?'':'sport',text:custom.days[i].title};
    if(w)return {cls:'lift',text:'Treino '+w.letter+': '+w.title};
    if(sportDays.includes(i))return {cls:'sport',text:SPORTS[p.sport]};
    return {cls:'',text:'Descanso ou caminhada leve'};
  });

  const alerts=[];
  if(flags.includes('circ'))alerts.push(['Liberação médica','Por causa do problema circulatório, consulte um angiologista antes de começar e leve este plano. Pare e procure atendimento se a perna inchar, esquentar, ficar vermelha ou doer, ou se sentir falta de ar.']);
  if(flags.includes('circ')&&CONTACT.includes(p.sport))alerts.push([SPORTS[p.sport]+' sem contato','Faça só aulas técnicas, sem luta com contato, até o médico liberar. Quem usa anticoagulante tem mais risco de sangramento ao levar golpes.']);
  if(flags.includes('knee')||flags.includes('shoulder')||flags.includes('back'))alerts.push(['Lesões','Os exercícios que forçam a região já foram trocados. Se doer, pare e procure um fisioterapeuta.']);
  if(bmi>=30||p.age>=40)alerts.push(['Avaliação antes de começar','Faça um check-up com exames e eletrocardiograma antes de treinar forte.']);
  if(!custom&&n===0)alerts.push(['Sem dias de musculação','Escolha pelo menos 2 dias no perfil para montar os treinos.']);
  if(!custom&&n>=3&&adj>=2&&n<5)alerts.push(['Dias seguidos','Como os treinos caem em dias seguidos, cada um trabalha uma parte diferente do corpo para dar tempo de recuperação.']);

  return {bmi,healthy,target,weeks,kcal,prot,fat,carb,water,workouts,week,alerts,sessions,custom};
}

function chartSVG(ws,target){
  if(ws.length<1)return '';
  const W=640,H=220,pl=44,pr=16,pt=16,pb=30;
  const vals=ws.map(w=>w.kg).concat(target?[target]:[]);
  let mn=Math.floor(Math.min(...vals)-1),mx=Math.ceil(Math.max(...vals)+1);
  const t0=new Date(ws[0].date).getTime(),t1=new Date(ws[ws.length-1].date).getTime();
  const x=d=>ws.length===1?(pl+W-pr)/2:pl+(new Date(d).getTime()-t0)/(t1-t0||1)*(W-pl-pr);
  const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);
  const step=Math.max(1,Math.ceil((mx-mn)/5));let grid='';
  for(let v=mn;v<=mx;v+=step)grid+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${v}</text>`;
  const pts=ws.map(w=>`${x(w.date)},${y(w.kg)}`).join(' ');
  const last=ws[ws.length-1];
  const tl=target?`<line x1="${pl}" x2="${W-pr}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ok)" stroke-dasharray="5 4"/><text x="${W-pr}" y="${y(target)-6}" text-anchor="end" font-size="11" fill="var(--ok)">meta ${fmt(target)} kg</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução do peso">${grid}${tl}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.kg)}" r="3" fill="var(--accent)"/>`).join('')}
    <circle cx="${x(last.date)}" cy="${y(last.kg)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
    <text x="${pl}" y="${H-8}" font-size="11" fill="var(--muted)">${brDate(ws[0].date)}</text>
    <text x="${W-pr}" y="${H-8}" text-anchor="end" font-size="11" fill="var(--muted)">${brDate(last.date)}</text></svg>`;
}

let confirmDel=false,aiDraft=null,aiText='',openImport=false;
const DAYWORDS=[['segunda','seg','monday','mon'],['terça','terca','ter','tuesday','tue'],['quarta','qua','wednesday','wed'],['quinta','qui','thursday','thu'],['sexta','sex','friday','fri'],['sábado','sabado','sáb','sab','saturday','sat'],['domingo','dom','sunday','sun']];
const L_=String.raw`\p{L}`;
function findDays(line){
  const low=line.toLowerCase(),found=[];
  DAYWORDS.forEach((ws,i)=>{if(ws.some((w,j)=>(j<2||w.length>3||low.length<40)&&new RegExp(`(?<!${L_})${w}(?!${L_})`,'u').test(low)))found.push(i)});
  // "segunda a sexta"
  const m=low.match(/(segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)(?:-feira)?\s+(?:a|à|até)\s+(terça|terca|quarta|quinta|sexta|sábado|sabado|domingo)/u);
  if(m){const a=DAYWORDS.findIndex(w=>w.includes(m[1])),b=DAYWORDS.findIndex(w=>w.includes(m[2]));for(let i=a;i<=b;i++)if(!found.includes(i))found.push(i)}
  return found.sort();
}
const SETS_RE=/(\d+)\s*(?:x|×)\s*(\d+(?:\s*(?:-|–|a)\s*\d+)?\s*(?:segundos|seg|s|minutos|min|m|km|reps?|repetições)?(?!\p{L})|máx\p{L}*|max\p{L}*|falha)|(\d+)\s*séries?\s*(?:de\s*)?(\d+(?:\s*(?:-|–|a)\s*\d+)?\s*(?:segundos|seg|s|minutos|min|reps?|repetições)?)/iu;
function cleanLine(l){return l.replace(/\*\*|__|`/g,'').replace(/^\s*(?:[#>*•·\-–—]+|\d+[.)]|[a-z][.)])\s*/iu,'').trim()}
function parseAI(text){
  const days={};let cur=[];
  text.split(/\r?\n/).forEach(raw=>{
    let line=raw.trim();if(!line||/^\|?\s*:?-{3,}/.test(line))return;
    if(line.includes('|')){const cells=line.split('|').map(c=>c.trim()).filter(Boolean);if(/exerc[ií]cio|exercise/i.test(cells[0]||''))return;line=cells.join(' ')}
    const c=cleanLine(line);if(!c)return;
    const ds=findDays(c),hasSets=SETS_RE.test(c);
    if(ds.length&&!hasSets&&c.length<90){
      let title=c.replace(/-feira/giu,'');DAYWORDS.flat().forEach(w=>{title=title.replace(new RegExp(`(?<!${L_})${w}(?!${L_})`,'giu'),'')});
      title=title.replace(/\b(e|a|à|até|dia|day)\b/giu,' ').replace(/^[\s:,\-–—()]+|[\s:,\-–—()]+$/gu,'').replace(/\s{2,}/g,' ').replace(/^\(|\)$/g,'');
      title=title.replace(/\(\s*\)/g,'').replace(/^\d+\s*[:\-–]?\s*/u,'').replace(/^[\s:,\-–—]+/u,'').trim();
      if(!title)title='Treino';title=title.charAt(0).toUpperCase()+title.slice(1);
      cur=ds;ds.forEach(d=>{days[d]={title,exercises:[]}});return;
    }
    if(!cur.length)return;
    const m=c.match(SETS_RE);let ex;
    if(m){const name=c.slice(0,m.index).replace(/[\s:–—\-(,]+$/u,'').trim();const note=c.slice(m.index+m[0].length).replace(/^[\s,;:\-–—]+|[\s)]+$/gu,'').replace(/^\(/,'').trim();
      if(!name)return;ex={name,sets:+(m[1]||m[3]),reps:(m[2]||m[4]||'').trim(),note};}
    else{if(c.length>70||/^(obs|dica|nota|aqueciment|descanso entre|importante)/iu.test(c))return;
      const t=c.match(/(\d+\s*(?:min|minutos|km|s|seg))\b/iu);ex={name:t?c.replace(t[0],'').replace(/[\s:–\-]+$/u,'').trim()||c:c,sets:null,reps:t?t[1]:'',note:''}}
    cur.forEach(d=>days[d].exercises.push({...ex}));
  });
  return days;
}

const DB={db:null,mem:[],
  open(){return new Promise(res=>{try{const r=indexedDB.open('treino-fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('entries',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})},
  all(pid){return new Promise(res=>{if(!this.db)return res(this.mem.filter(e=>e.pid===pid));try{const q=this.db.transaction('entries').objectStore('entries').getAll();q.onsuccess=()=>res(q.result.filter(e=>e.pid===pid));q.onerror=()=>res([])}catch(e){res([])}})},
  put(e){return new Promise(res=>{this.mem=this.mem.filter(x=>x.id!==e.id).concat(e);if(!this.db)return res();try{const t=this.db.transaction('entries','readwrite');t.objectStore('entries').put(e);t.oncomplete=t.onerror=()=>res()}catch(_){res()}})},
  del(id){return new Promise(res=>{this.mem=this.mem.filter(x=>x.id!==id);if(!this.db)return res();try{const t=this.db.transaction('entries','readwrite');t.objectStore('entries').delete(id);t.oncomplete=t.onerror=()=>res()}catch(_){res()}})}
};

function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=900,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

  return Object.values(days).some(d=>d.exercises.length)?days:null;
}

async function sendIA(text){
  text=(text||'').trim();if(!text||aiBusy||!(sampleFn||extCfg().key))return;
  const chat=CHAT();chat.push({role:'user',content:text});
  const turns=chat.filter(m=>!m.err).slice(-12).map(m=>({role:m.role,content:m.role==='assistant'&&m.plan?m.content+'\n(Plano proposto: '+Object.keys(m.plan).map(d=>DAYS_FULL[d]+' '+m.plan[d].title).join(', ')+')':m.content}));
  while(turns.length&&turns[0].role!=='user')turns.shift();
  aiBusy=new AbortController();render();scrollChat();
  try{
    const r=sampleFn?await sampleFn.json([{role:'user',content:coachRules()},...turns],{cache:false,signal:aiBusy.signal}):await askExternal(coachRules(),turns,aiBusy.signal);
    const reply=String(r&&r.reply||'Pronto.').slice(0,2000);
    chat.push({role:'assistant',content:reply,plan:normPlan(r&&r.plan)});
  }catch(e){
    if(e&&e.ext){chat.push({role:'assistant',err:1,content:e.ext})}
    else if(e&&e.code==='not_granted'||e&&e.code==='sampling_disabled'){chat.push({role:'assistant',err:1,content:'O assistente precisa da sua permissão para usar o Claude. Abra o app de novo e toque em Permitir.'})}
    else if(e&&(e.code==='cancelled'||e.name==='AbortError')){chat.pop()}
    else if(e&&e.code==='rate_limited'){chat.push({role:'assistant',err:1,content:'Muitas mensagens seguidas ou limite de uso atingido. Tente de novo daqui a pouco.'})}
    else if(e&&e.code==='invalid_json'){chat.push({role:'assistant',err:1,content:'Não consegui montar a resposta. Tente pedir de outro jeito.'})}
    else chat.push({role:'assistant',err:1,content:'Não consegui responder agora. Tente de novo.'});
  }
  aiBusy=null;if(chat.length>40)chat.splice(0,chat.length-40);save();if(tab==='ia'){render();scrollChat()}
}

async function askExternal(rules,turns,signal){
  const c=extCfg(),pv=PROVIDERS[c.provider],model=(c.model||pv.model).trim();
  const merged=[];turns.forEach(t=>{const l=merged[merged.length-1];if(l&&l.role===t.role)l.content+='\n\n'+t.content;else merged.push({...t})});
  let res,body;
  try{
    if(c.provider==='gemini'){
      res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',signal,headers:{'Content-Type':'application/json','x-goog-api-key':c.key},
        body:JSON.stringify({systemInstruction:{parts:[{text:rules}]},contents:merged.map(t=>({role:t.role==='assistant'?'model':'user',parts:[{text:t.content}]})),generationConfig:{responseMimeType:'application/json',temperature:0.6}})});
    }else{
      res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
        body:JSON.stringify({model,messages:[{role:'system',content:rules},...merged],response_format:{type:'json_object'},temperature:0.6})});
    }
  }catch(e){if(e.name==='AbortError')throw e;throw {ext:`Não consegui falar com o ${pv.name}. Confira a internet e tente de novo.`}}
  try{body=await res.json()}catch(_){body=null}
  if(!res.ok){
    if(res.status===400&&/model/i.test(JSON.stringify(body||'')))throw {ext:`O modelo "${model}" não foi aceito pelo ${pv.name}. Toque em Trocar IA e confira o nome do modelo.`};
    if(res.status===400||res.status===401||res.status===403)throw {ext:`A chave do ${pv.name} foi recusada. Toque em Trocar IA e cole a chave de novo.`};
    if(res.status===429)throw {ext:c.provider==='openai'?'Limite ou crédito da OpenAI esgotado. Confira o saldo da sua conta.':'Limite gratuito do Gemini atingido. Espere um pouco e tente de novo.'};
    if(res.status===404)throw {ext:`O modelo "${model}" não existe no ${pv.name}. Toque em Trocar IA e confira o nome.`};
    throw {ext:`O ${pv.name} respondeu com erro (${res.status}). Tente de novo.`};
  }
  const text=c.provider==='gemini'?(body?.candidates?.[0]?.content?.parts||[]).map(x=>x.text||'').join(''):body?.choices?.[0]?.message?.content;
  if(!text)throw {ext:`O ${pv.name} não devolveu resposta. Tente pedir de outro jeito.`};
  const m=text.match(/\{[\s\S]*\}/);
  try{return JSON.parse(m?m[0]:text)}catch(_){return {reply:text.slice(0,2000),plan:null}}
}

  corrida:'<circle cx="14.5" cy="5.5" r="1.6"/><path d="M8 20l3-5 2.5 2V21M10 10.5l3-2 2.5 3 3 .5M13 8.5 11 14l-4-1"/>',
  folha:'<path d="M5 19c0-8 5-13 14-13 0 9-5 14-13 14"/><path d="M5 19 13 11"/>'

function avatarHTML(p,size){
  const st=`width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;`;
  if(p.photo)return `<span class="av" style="${st}"><img src="${p.photo}" alt=""></span>`;
  const color=p.avColor||AV_COLORS[Math.abs([...p.id].reduce((a,c)=>a+c.charCodeAt(0),0))%AV_COLORS.length];
  if(p.avIcon&&AV_ICONS[p.avIcon])return `<span class="av" style="${st}background:${color}"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${AV_ICONS[p.avIcon]}</svg></span>`;
  const ini=(p.name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
  return `<span class="av" style="${st}background:${color}">${esc(ini)}</span>`;
}
function readForm(p){if(!document.getElementById('f-name'))return;const v=id=>document.getElementById(id).value;
  const checked=n=>[...view.querySelectorAll(`input[name="${n}"]:checked`)].map(i=>i.value);const name=v('f-name').trim();
  const num=(id,min,max,def)=>{const n=parseFloat(v(id));return n>=min&&n<=max?n:def};
  Object.assign(p,{name,sex:v('f-sex'),age:num('f-age',14,90,p.age),weight:num('f-weight',30,300,p.weight),height:num('f-height',120,230,p.height),
    level:v('f-level'),goal:v('f-goal'),place:v('f-place'),liftDays:checked('lift').map(Number),sport:v('f-sport'),
    sportDays:checked('sport').map(Number),flags:checked('flag'),notes:v('f-notes')});
}
function newProfile(){
    const nid='p'+Date.now().toString(36);
    S.profiles.push({id:nid,name:'',sex:'m',age:30,weight:75,height:170,level:'iniciante',goal:'emagrecer',place:'academia',liftDays:[0,2,4],sport:'nenhum',sportDays:[],flags:[],notes:''});
    S.logs[nid]={weights:[],workouts:[]};S.active=nid;trainSel=null;save();tab='perfil';render();document.getElementById('f-name').focus();
}
function renderWho(){
  document.getElementById('who').innerHTML=S.profiles.map(p=>`<button type="button" class="pp" data-pid="${p.id}" aria-pressed="${p.id===S.active}">${avatarHTML(p,44)}<span>${esc(p.name)||'Sem nome'}</span></button>`).join('')
    +`<button type="button" class="pp add" id="addPerson" aria-label="Nova pessoa"><span class="av" style="width:44px;height:44px;font-size:22px">+</span><span>Nova</span></button>`;
}
function avatarEditor(p){
  return `<div class="field wide"><label>Avatar</label><div class="avbig">${avatarHTML(p,84)}
    <div class="row"><label class="chip" for="av-photo">Usar minha foto</label><input type="file" id="av-photo" accept="image/*" hidden>${p.photo?`<button type="button" id="avRemove">Remover foto</button>`:''}</div></div>
    <div class="avgrid">${['',...Object.keys(AV_ICONS)].map(k=>`<button type="button" data-avicon="${k}" aria-pressed="${!p.photo&&(p.avIcon||'')===k}" aria-label="${k||'Iniciais'}">${avatarHTML({...p,photo:null,avIcon:k},40)}</button>`).join('')}</div>
    <div class="colors">${AV_COLORS.map(c=>`<button type="button" data-avcolor="${c}" style="background:${c}" aria-pressed="${p.avColor===c}" aria-label="Cor ${c}"></button>`).join('')}</div></div>`;
}
function squarePhoto(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const m=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=256;
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,256,256);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}

/* ---------- render e eventos ---------- */
function render(){
  renderWho();
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  if(tab==='fotos'){view.innerHTML=renderFotosShell();fillFotos();return}
  if(tab==='ia'){view.innerHTML=renderIA();return}
  view.innerHTML={plano:renderPlano,treino:renderTreino,progresso:renderProgresso,perfil:renderPerfil}[tab]();
}
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;confirmDel=false;try{localStorage.setItem(KEY+'.tab',tab)}catch(_){}render()});
document.getElementById('who').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='addPerson'){newProfile();return}
  if(b.dataset.pid&&b.dataset.pid!==S.active){S.active=b.dataset.pid;trainSel=null;confirmRec=null;pendingPhoto=null;aiDraft=null;save();render();toast('Perfil de '+(P().name||'nova pessoa'))}});
view.addEventListener('change',async e=>{if(e.target.id!=='av-photo')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  try{readForm(P());P().photo=await squarePhoto(f);save();render();toast('Foto do perfil atualizada')}catch(_){toast('Não consegui abrir essa imagem')}});
view.addEventListener('keydown',e=>{if(e.target.id==='ia-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendIA(e.target.value)}});
view.addEventListener('change',e=>{if(e.target.id==='ext-prov'){const k=document.getElementById('ext-key').value;const c={provider:e.target.value,key:k,model:PROVIDERS[e.target.value].model};view.innerHTML=renderExtSetup(c);return}if(e.target.id==='wsel'){trainSel=e.target.value;render()}});
view.addEventListener('click',e=>{
  const id=e.target.id;
  if(id==='saveW'){
    const pl=buildPlan(P()),w=pl.workouts.find(x=>x.id===trainSel);
    const entries=w.exercises.map((ex,i)=>({key:ex.key,name:ex.name,loads:Array.from({length:ex.sets},(_,s)=>{const el=document.getElementById(`s-${i}-${s}`);return ex.load?el.value:(el.checked?'ok':'')})}));
    if(!entries.some(en=>en.loads.some(v=>v!==''))){toast('Preencha pelo menos uma série');return}
    const wd=document.getElementById('wdate').value||isoToday();
    L().workouts.push({date:wd,title:'Treino '+w.letter+': '+w.title,entries});L().checkins[wd]=L().checkins[wd]||'lift';
    save();toast('Treino salvo');render();
  }
  if(id==='checkin'){const pl=buildPlan(P());L().checkins[isoToday()]=pl.week[todayIdx()].cls||'extra';save();toast('Check-in feito. Bom treino!');render()}
  if(id==='uncheck'){delete L().checkins[isoToday()];save();toast('Check-in desfeito');render()}
  if(id==='goPerfil'){tab='ia';openImport=true;render();openImport=false;const b=document.getElementById('aiBox');if(b)b.scrollIntoView()}
  if(id==='copyPrompt'){const ta=document.getElementById('ai-prompt');const done=()=>toast('Pedido copiado. Cole na IA.');
    try{navigator.clipboard.writeText(ta.value).then(done,()=>{ta.select();toast('Selecionei o texto. Copie com Ctrl+C ou segurando o dedo.')})}catch(_){ta.select();toast('Selecionei o texto. Copie com Ctrl+C ou segurando o dedo.')}}
  if(id==='parseAI'){aiDraft=parseAI(document.getElementById('ai-text').value);aiText=document.getElementById('ai-text').value;
    if(!Object.values(aiDraft).some(d=>d.exercises.length)){aiDraft=null;toast('Não achei dias da semana com exercícios. Use o pedido acima na IA.');return}render()}
  if(id==='applyAI'){applyDays(aiDraft);aiDraft=null;aiText='';toast('Treino importado');tab='plano';render()}
  const avb=e.target.closest('[data-avicon],[data-avcolor]');
  if(avb){const p=P();readForm(p);if(avb.dataset.avicon!==undefined){p.avIcon=avb.dataset.avicon;p.photo=null}if(avb.dataset.avcolor){p.avColor=avb.dataset.avcolor;p.photo=null}save();render();return}
  if(id==='avRemove'){P().photo=null;save();render()}
  if(id==='iaSetupBtn'){iaSetup=true;render()}
  if(id==='extBack'){iaSetup=false;render()}
  if(id==='extRemove'){saveExt({provider:extCfg().provider,key:'',model:''});iaSetup=false;toast('Chave removida');render()}
  if(id==='iaSend'){sendIA(document.getElementById('ia-in').value)}
  if(id==='iaStop'){aiBusy&&aiBusy.abort()}
  if(id==='iaClear'){CHAT().length=0;save();render()}
  if(e.target.dataset.sug){sendIA(e.target.dataset.sug)}
  if(e.target.dataset.apply){const m=CHAT()[+e.target.dataset.apply];if(m&&m.plan){applyDays(m.plan);m.applied=1;save();toast('Treino aplicado. Veja na aba Plano.');render()}}
  if(id==='cancelAI'){aiDraft=null;render()}
  if(id==='autoPlan'){P().custom.active=false;trainSel=null;save();toast('Voltou para o plano automático');render()}
  if(id==='reuseAI'){P().custom.active=true;trainSel=null;save();toast('Treino importado reativado');render()}
  if(id==='addKg'){
    const kg=parseFloat(document.getElementById('wkKg').value),date=document.getElementById('wkDate').value||isoToday();
    if(!(kg>=30&&kg<=300)){toast('Digite um peso entre 30 e 300 kg');return}
    const lg=L();lg.weights=lg.weights.filter(w=>w.date!==date);lg.weights.push({date,kg});
    P().weight=kg;save();toast('Peso registrado');render();
  }
  if(id==='newP'){newProfile()}

  if(id==='delP'){confirmDel=true;render()}
  if(id==='delNo'){confirmDel=false;render()}
  if(id==='delYes'){const pid=P().id;S.profiles=S.profiles.filter(p=>p.id!==pid);delete S.logs[pid];S.active=S.profiles[0].id;confirmDel=false;save();toast('Perfil excluído');render()}
});
view.addEventListener('submit',e=>{
  e.preventDefault();if(e.target.id==='extForm'){const key=document.getElementById('ext-key').value.trim();if(!key){toast('Cole a chave de API');return}
    saveExt({provider:document.getElementById('ext-prov').value,key,model:document.getElementById('ext-model').value.trim()});iaSetup=false;toast('IA conectada');render();return}if(e.target.id==='recForm'){saveRecord();return}const p=P(),v=id=>document.getElementById(id).value;
  const checked=n=>[...view.querySelectorAll(`input[name="${n}"]:checked`)].map(i=>i.value);
  const name=v('f-name').trim();if(!name){toast('Digite um nome');return}
  readForm(p);
  const lg=L();if(!lg.weights.length)lg.weights.push({date:isoToday(),kg:p.weight});
  save();toast('Perfil salvo');tab='plano';render();
});
try{const t=localStorage.getItem(KEY+'.tab');if(t)tab=t}catch(_){}
render();
